[project]
name = "muse-kernel"
version = "0.1.0"
description = "Event-sourced music intelligence kernel: events, PEG projection, upcasters."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
