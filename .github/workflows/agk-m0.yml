name: AGK-M0
on:
  workflow_dispatch:
  push:
    paths:
      - 'agk/**'
  pull_request:
    paths:
      - 'agk/**'
jobs:
  conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agk/package-lock.json
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: npm run m0
      - run: npm run receipt:validate
      - uses: actions/upload-artifact@v4
        with:
          name: AGK-M0-CONFORMANCE-RECEIPT
          path: agk/AGK-M0-CONFORMANCE-RECEIPT.json
